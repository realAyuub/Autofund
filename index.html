<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BilFinder AI</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#07090f;color:#e6edf3;font-family:'DM Sans',sans-serif}
    a{color:inherit;text-decoration:none}
    button{font-family:'DM Sans',sans-serif}
    input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
    ::placeholder{color:#30363d}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-thumb{background:#21262d;border-radius:4px}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const BRANDS = ["Audi","BMW","Citroën","Dacia","Fiat","Ford","Honda","Hyundai","Kia","Mazda","Mercedes-Benz","Mini","Nissan","Opel","Peugeot","Renault","Seat","Skoda","Tesla","Toyota","Volkswagen","Volvo","Polestar","Cupra","MG"];
    const BODY_TYPES = ["Hatchback","Sedan","Stationcar","SUV","MPV","Cabriolet","Pickup","Coupe"];
    const FUEL_TYPES = ["Benzin","Diesel","El","Hybrid","Plugin-hybrid"];
    const REGIONS = ["Hele Danmark","Sjælland","Fyn","Jylland","København og omegn","Aarhus","Odense"];
    const PRIORITIES = ["Lavt brændstofforbrug","God gensalgsværdi","Pålidelig motor","Lave serviceomkostninger","Sikkerhed","Komfort","Stor bagagerum","Teknologi & skærme","Ladetid","Plads til familien","Lav forsikring","Firehjulstræk"];
    const STEPS = [
      {id:"family",label:"Familie",icon:"👨‍👩‍👧"},
      {id:"economy",label:"Økonomi",icon:"💰"},
      {id:"usage",label:"Brug",icon:"🛣️"},
      {id:"type",label:"Biltype",icon:"🚗"},
      {id:"prefs",label:"Ønsker",icon:"⭐"},
      {id:"results",label:"Resultater",icon:"✨"},
    ];
    const BB_FUEL = {Benzin:"1",Diesel:"2",Hybrid:"3","Plugin-hybrid":"4",El:"5"};
    const BB_BODY = {Hatchback:"1",Sedan:"2",Stationcar:"4",Cabriolet:"5",Pickup:"7",MPV:"8",Coupe:"9",SUV:"16"};
    const BB_BRAND_SLUG = {"Audi":"audi","BMW":"bmw","Citroën":"citroen","Dacia":"dacia","Fiat":"fiat","Ford":"ford","Honda":"honda","Hyundai":"hyundai","Kia":"kia","Mazda":"mazda","Mercedes-Benz":"mercedes-benz","Mini":"mini","Nissan":"nissan","Opel":"opel","Peugeot":"peugeot","Renault":"renault","Seat":"seat","Skoda":"skoda","Tesla":"tesla","Toyota":"toyota","Volkswagen":"volkswagen","Volvo":"volvo","Polestar":"polestar","Cupra":"cupra","MG":"mg"};
    const fmtDKK = n => new Intl.NumberFormat("da-DK").format(Math.round(n)) + " kr.";
    const C = {bg:"#07090f",surface:"#0d1117",border:"#161b22",border2:"#21262d",gold:"#e3b96a",goldDim:"#e3b96a18",goldBorder:"#e3b96a44",text:"#e6edf3",muted:"#8b949e",dim:"#30363d",green:"#3fb950",red:"#f85149",teal:"#58a6ff"};

    const SYSTEM_ONE = `Du er Danmarks bedste uafhængige bilrådgiver. Du kender alle bilmodeller i Danmark.
Returner KUN ét JSON-objekt for ÉN bilanbefaling. Ingen tekst før/efter, ingen backticks.
{
  "brand": "Toyota","model": "RAV4","variant": "2.5 Hybrid Active","year_range": "2020-2023",
  "short_why": ["Præcis 3 korte punkter","Maks 8 ord per punkt","Direkte og konkrete"],
  "long_why": "2-3 sætninger der uddyber valget specifikt for denne familie.",
  "price_new_dkk": 450000,"price_used_dkk": 310000,"fuel_type": "Hybrid","fuel_cost_monthly": 850,
  "resale": {"y1":285000,"y2":265000,"y3":248000,"y4":232000,"y5":218000,"y6":205000,"y7":193000,"y8":182000},
  "pros": ["Meget lavt brændstofforbrug","Exceptionel pålidelig","God familieplads"],
  "cons": ["Ikke billigst i klassen","Lidt kedelig at køre"],
  "safety_rating": 5,"reliability": "Meget høj",
  "bilbasen_brand_slug": "toyota","bilbasen_model_slug": "rav4"
}
short_why: præcis 3 strings. Resale: realistiske danske priser. Svar KUN med JSON.`;

    function buildProfile(f, rank, exclude) {
      return `Familie: ${f.adults} voksne, ${f.children} børn${f.childAges?` (${f.childAges})`:""}
Budget: ${f.budgetType==="kontant"?fmtDKK(f.budget)+" kontant":fmtDKK(f.monthly)+"/md"}
Daglig km: ${f.dailyKm}, Kørsel: ${f.driveType||"blandet"}
Drivmiddel: ${(f.fuels||[]).join(", ")||"ingen pref"}
Karosseri: ${(f.bodies||[]).join(", ")||"ingen pref"}
Foretrukne mærker: ${(f.brands||[]).join(", ")||"ingen pref"}
Uønskede mærker: ${[...(f.excludeBrands||[]),...(exclude||[])].join(", ")||"ingen"}
År fra: ${f.yearMin||"ingen"}, Max km: ${f.kmMax||"ingen"}
Prioriteter: ${(f.priorities||[]).join(", ")||"ingen"}
Særligt: ${f.extras||"ingen"}
${rank===2?"Giv et ALTERNATIVT forslag — anden biltype end det mest oplagte.":"Giv det BEDSTE matchende forslag."}
Undgå: ${(exclude||[]).join(", ")||"ingen"}`;
    }

    async function fetchOneCar(profile) {
      const res = await fetch("/api/mistral", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ profile }),
      });

      if (!res.ok) throw new Error("API fejl " + res.status);
      const data = await res.json();
      const text = data.choices?.[0]?.message?.content || "";
      const s = text.indexOf("{");
      const e = text.lastIndexOf("}");
      if (s === -1 || e === -1) throw new Error("Intet JSON");
      const parsed = JSON.parse(text.slice(s, e + 1));
      if (!parsed.brand) throw new Error("Mangler brand");
      return parsed;
    }

    function Chip({label,active,onClick}) {
      return <button onClick={onClick} style={{padding:"7px 14px",borderRadius:6,border:`1px solid ${active?C.gold:C.border2}`,background:active?C.goldDim:"transparent",color:active?C.gold:C.muted,fontSize:13,cursor:"pointer",fontWeight:active?600:400,whiteSpace:"nowrap"}}>{label}</button>;
    }
    function MultiChips({options,value=[],onChange}) {
      return <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{options.map(o=><Chip key={o} label={o} active={value.includes(o)} onClick={()=>onChange(value.includes(o)?value.filter(v=>v!==o):[...value,o])}/>)}</div>;
    }
    function SingleChips({options,value,onChange}) {
      return <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{options.map(o=><Chip key={o} label={o} active={value===o} onClick={()=>onChange(value===o?"":o)}/>)}</div>;
    }
    function MultiDropdown({value=[],onChange,options,placeholder}) {
      const [open,setOpen]=useState(false);
      const ref=useRef(null);
      useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);},[]);
      const toggle=o=>onChange(value.includes(o)?value.filter(v=>v!==o):[...value,o]);
      return <div ref={ref} style={{position:"relative"}}>
        <button onClick={()=>setOpen(!open)} style={{width:"100%",background:C.surface,border:`1px solid ${open?C.goldBorder:C.border2}`,borderRadius:8,padding:"10px 14px",color:value.length?C.text:C.dim,fontSize:14,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{value.length>0?(value.length<=3?value.join(", "):`${value.length} valgt`):placeholder}</span>
          <span style={{color:C.muted,fontSize:10,marginLeft:8}}>▼</span>
        </button>
        {open&&<div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,zIndex:200,background:"#161b22",border:`1px solid ${C.border2}`,borderRadius:8,boxShadow:"0 8px 32px #00000099",maxHeight:240,overflowY:"auto"}}>
          {options.map(o=><div key={o} onClick={()=>toggle(o)} style={{padding:"9px 14px",color:value.includes(o)?C.gold:C.text,fontSize:13,cursor:"pointer",background:value.includes(o)?C.goldDim:"transparent",display:"flex",alignItems:"center",gap:10}}
            onMouseEnter={e=>{if(!value.includes(o))e.currentTarget.style.background=C.border}}
            onMouseLeave={e=>{if(!value.includes(o))e.currentTarget.style.background="transparent"}}>
            <span style={{width:15,height:15,borderRadius:3,border:`1px solid ${value.includes(o)?C.gold:C.border2}`,background:value.includes(o)?C.gold:"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:"#000"}}>{value.includes(o)?"✓":""}</span>
            {o}
          </div>)}
        </div>}
      </div>;
    }
    function SingleDropdown({value,onChange,options,placeholder}) {
      const [open,setOpen]=useState(false);
      const ref=useRef(null);
      useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);},[]);
      return <div ref={ref} style={{position:"relative"}}>
        <button onClick={()=>setOpen(!open)} style={{width:"100%",background:C.surface,border:`1px solid ${open?C.goldBorder:C.border2}`,borderRadius:8,padding:"10px 14px",color:value?C.text:C.dim,fontSize:14,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span>{value||placeholder}</span><span style={{color:C.muted,fontSize:10}}>▼</span>
        </button>
        {open&&<div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,zIndex:200,background:"#161b22",border:`1px solid ${C.border2}`,borderRadius:8,boxShadow:"0 8px 32px #00000099",maxHeight:220,overflowY:"auto"}}>
          <div onClick={()=>{onChange("");setOpen(false);}} style={{padding:"9px 14px",color:C.dim,fontSize:13,cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background=C.border} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>Ingen præference</div>
          {options.map(o=><div key={o} onClick={()=>{onChange(o);setOpen(false);}} style={{padding:"9px 14px",color:value===o?C.gold:C.text,fontSize:13,cursor:"pointer",background:value===o?C.goldDim:"transparent"}}
            onMouseEnter={e=>{if(value!==o)e.currentTarget.style.background=C.border}} onMouseLeave={e=>{if(value!==o)e.currentTarget.style.background="transparent"}}>{o}</div>)}
        </div>}
      </div>;
    }
    function NumInput({value,onChange,placeholder,suffix}) {
      return <div style={{position:"relative"}}>
        <input type="number" value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{width:"100%",background:C.surface,border:`1px solid ${C.border2}`,borderRadius:8,padding:`10px ${suffix?"52px":"14px"} 10px 14px`,color:C.text,fontSize:14,outline:"none"}} onFocus={e=>e.target.style.borderColor=C.goldBorder} onBlur={e=>e.target.style.borderColor=C.border2}/>
        {suffix&&<span style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",color:C.muted,fontSize:12,pointerEvents:"none"}}>{suffix}</span>}
      </div>;
    }
    function TxtInput({value,onChange,placeholder}) {
      return <input type="text" value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{width:"100%",background:C.surface,border:`1px solid ${C.border2}`,borderRadius:8,padding:"10px 14px",color:C.text,fontSize:14,outline:"none"}} onFocus={e=>e.target.style.borderColor=C.goldBorder} onBlur={e=>e.target.style.borderColor=C.border2}/>;
    }
    function Field({label,hint,children}) {
      return <div style={{marginBottom:22}}>
        <div style={{marginBottom:9}}><span style={{color:C.text,fontSize:13,fontWeight:600}}>{label}</span>{hint&&<span style={{color:C.dim,fontSize:12,marginLeft:8}}>{hint}</span>}</div>
        {children}
      </div>;
    }

    function App() {
      const [step,setStep]=useState(0);
      const [form,setForm]=useState({adults:"2",children:"0",childAges:"",region:"",budgetType:"kontant",budget:"",monthly:"",yearMin:"",kmMax:"",dailyKm:"",driveType:"",extras:"",bodies:[],fuels:[],brands:[],excludeBrands:[],priorities:[],transmission:"",towbar:""});
      const [showResults,setShowResults]=useState(false);
      const [summary,setSummary]=useState("");
      const [cards,setCards]=useState([null,null]);
      const [loadingA,setLoadingA]=useState(false);
      const [loadingB,setLoadingB]=useState(false);
      const [error,setError]=useState("");
      const [excluded,setExcluded]=useState([[],[]]);
      const set=k=>v=>setForm(f=>({...f,[k]:v}));

      const canNext = s => {
        if(s===0) return form.adults!=="" && form.children!=="";
        if(s===1) return form.budget||form.monthly;
        if(s===2) return form.dailyKm;
        return true;
      };

      async function runSearch(excl) {
        setShowResults(true);
        setCards([null,null]);
        setLoadingA(true);
        setLoadingB(true);
        setError("");
        const [pA,pB] = await Promise.allSettled([
          fetchOneCar(buildProfile(form,1,excl[0])),
          fetchOneCar(buildProfile(form,2,[...excl[1],...excl[0]]))
        ]);
        if(pA.status==="fulfilled") {
          setCards(c=>[pA.value,c[1]]);
          if(!summary) setSummary(`Baseret på jeres profil har vi fundet ${pA.value.brand} ${pA.value.model} som bedste match.`);
        } else {
          setError("Kunne ikke hente anbefaling — tjek at API-nøglen er korrekt.");
        }
        setLoadingA(false);
        if(pB.status==="fulfilled") setCards(c=>[c[0],pB.value]);
        setLoadingB(false);
      }

      async function handleReject(idx) {
        const rejected = cards[idx] ? `${cards[idx].brand} ${cards[idx].model}` : "";
        const newExcl = excluded.map((e,i)=>i===idx?[...e,rejected]:e);
        setExcluded(newExcl);
        if(idx===0){setLoadingA(true);setCards(c=>[null,c[1]]);}
        else {setLoadingB(true);setCards(c=>[c[0],null]);}
        try {
          const car = await fetchOneCar(buildProfile(form,idx===0?1:2,newExcl[idx]));
          if(idx===0) setCards(c=>[car,c[1]]);
          else setCards(c=>[c[0],car]);
        } catch {
          setError("Kunne ikke hente nyt forslag.");
        }
        if(idx===0) setLoadingA(false); else setLoadingB(false);
      }

      const commonButton = {background:C.gold,color:"#000",border:"none",padding:"11px 26px",borderRadius:8,fontFamily:"'DM Sans',sans-serif",fontSize:13,fontWeight:700,cursor:"pointer"};

      return (
        <div style={{minHeight:"100vh",background:C.bg}}>
          <div style={{borderBottom:`1px solid ${C.border}`,padding:"14px 24px",display:"flex",alignItems:"center",gap:9}}>
            <span style={{fontSize:17}}>🚗</span>
            <span style={{fontFamily:"'Sora',sans-serif",fontSize:17,fontWeight:800,color:C.text}}>BilFinder</span>
            <span style={{background:C.goldDim,border:`1px solid ${C.goldBorder}`,color:C.gold,fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:20,letterSpacing:1}}>AI</span>
            <span style={{marginLeft:"auto",color:C.dim,fontSize:11}}>Uafhængig rådgivning · Kun Danmark</span>
          </div>
          <div style={{maxWidth:600,margin:"0 auto",padding:"32px 18px 80px"}}>
            <div style={{marginBottom:32}}>
              <div style={{display:"flex",alignItems:"center",marginBottom:8}}>
                {STEPS.map((s,i)=><div key={s.id} style={{display:"flex",alignItems:"center",flex:i<STEPS.length-1?1:"none"}}>
                  <div style={{width:30,height:30,borderRadius:"50%",background:i<step?C.gold:"transparent",border:`2px solid ${i<step?C.gold:i===step?C.gold:C.border2}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:i<step?11:13,color:i<step?"#000":i===step?C.gold:C.dim}}>{i<step?"✓":s.icon}</div>
                  {i<STEPS.length-1&&<div style={{flex:1,height:1,margin:"0 5px",background:i<step?C.gold:C.border}}/>}
                </div>)}
              </div>
              <div style={{display:"flex",justifyContent:"space-between"}}>
                {STEPS.map((s,i)=><div key={s.id} style={{color:i===step?C.gold:i<step?C.muted:C.dim,fontSize:10,fontWeight:i===step?700:400,textAlign:"center",flex:1}}>{s.label}</div>)}
              </div>
            </div>

            {step===0 && <div style={{animation:"fadeUp .3s ease"}}>
              <h2 style={{fontFamily:"'Sora',sans-serif",fontSize:20,fontWeight:800,color:C.text,marginBottom:5}}>Fortæl om familien</h2>
              <p style={{color:C.muted,fontSize:13,marginBottom:26}}>Hvem skal bruge bilen?</p>
              <Field label="Antal voksne"><SingleChips options={["1","2","3","4+"]} value={form.adults} onChange={v=>set("adults")(v)}/></Field>
              <Field label="Antal børn"><SingleChips options={["0","1","2","3","4+"]} value={form.children} onChange={v=>set("children")(v)}/></Field>
              {form.children!=="0"&&form.children!==""&&<Field label="Børnenes aldre" hint="valgfrit"><TxtInput value={form.childAges} onChange={v=>set("childAges")(v)} placeholder="F.eks. 3, 7, 12"/></Field>}
              <Field label="Geografisk område"><SingleDropdown value={form.region} onChange={v=>set("region")(v)} options={REGIONS} placeholder="Vælg region"/></Field>
            </div>}

            {step===1 && <div style={{animation:"fadeUp .3s ease"}}>
              <h2 style={{fontFamily:"'Sora',sans-serif",fontSize:20,fontWeight:800,color:C.text,marginBottom:5}}>Økonomi</h2>
              <p style={{color:C.muted,fontSize:13,marginBottom:26}}>Hvad er jeres budget?</p>
              <Field label="Betalingsform"><SingleChips options={["kontant","månedlig"]} value={form.budgetType} onChange={v=>set("budgetType")(v)}/></Field>
              {form.budgetType==="månedlig"
                ? <Field label="Månedlig ydelse"><NumInput value={form.monthly} onChange={v=>set("monthly")(v)} placeholder="F.eks. 4500" suffix="kr./md."/></Field>
                : <Field label="Kontantbudget"><NumInput value={form.budget} onChange={v=>set("budget")(v)} placeholder="F.eks. 350000" suffix="kr."/></Field>}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
                <Field label="Tidligste årsmodel" hint="valgfrit"><NumInput value={form.yearMin} onChange={v=>set("yearMin")(v)} placeholder="F.eks. 2018"/></Field>
                <Field label="Max km-stand" hint="valgfrit"><NumInput value={form.kmMax} onChange={v=>set("kmMax")(v)} placeholder="F.eks. 100000" suffix="km"/></Field>
              </div>
            </div>}

            {step===2 && <div style={{animation:"fadeUp .3s ease"}}>
              <h2 style={{fontFamily:"'Sora',sans-serif",fontSize:20,fontWeight:800,color:C.text,marginBottom:5}}>Daglig brug</h2>
              <p style={{color:C.muted,fontSize:13,marginBottom:26}}>Hvordan bruges bilen til hverdag?</p>
              <Field label="Daglig km-forbrug"><NumInput value={form.dailyKm} onChange={v=>set("dailyKm")(v)} placeholder="F.eks. 40" suffix="km/dag"/></Field>
              <Field label="Primær kørsel"><SingleChips options={["Primært by","Blandet","Primært motorvej"]} value={form.driveType} onChange={v=>set("driveType")(v)}/></Field>
              <Field label="Særlige behov" hint="valgfrit"><TxtInput value={form.extras} onChange={v=>set("extras")(v)} placeholder="Anhænger, barnevogn, hunde..."/></Field>
            </div>}

            {step===3 && <div style={{animation:"fadeUp .3s ease"}}>
              <h2 style={{fontFamily:"'Sora',sans-serif",fontSize:20,fontWeight:800,color:C.text,marginBottom:5}}>Biltype</h2>
              <p style={{color:C.muted,fontSize:13,marginBottom:26}}>Hvad forestiller I jer?</p>
              <Field label="Karosseri" hint="vælg gerne flere"><MultiChips options={BODY_TYPES} value={form.bodies} onChange={v=>set("bodies")(v)}/></Field>
              <Field label="Drivmiddel" hint="vælg gerne flere"><MultiChips options={FUEL_TYPES} value={form.fuels} onChange={v=>set("fuels")(v)}/></Field>
              <Field label="Foretrukne mærker" hint="vælg gerne flere"><MultiDropdown value={form.brands} onChange={v=>set("brands")(v)} options={BRANDS} placeholder="Ingen præference"/></Field>
              <Field label="Uønskede mærker"><MultiDropdown value={form.excludeBrands} onChange={v=>set("excludeBrands")(v)} options={BRANDS} placeholder="Ingen uønskede mærker"/></Field>
            </div>}

            {step===4 && <div style={{animation:"fadeUp .3s ease"}}>
              <h2 style={{fontFamily:"'Sora',sans-serif",fontSize:20,fontWeight:800,color:C.text,marginBottom:5}}>Hvad er vigtigst?</h2>
              <p style={{color:C.muted,fontSize:13,marginBottom:26}}>Vælg hvad der betyder mest for jer.</p>
              <Field label="Prioriteter" hint="vælg gerne flere"><MultiChips options={PRIORITIES} value={form.priorities} onChange={v=>set("priorities")(v)}/></Field>
              <Field label="Gearkasse" hint="valgfrit"><SingleChips options={["Automatgear","Manuel","Ligemeget"]} value={form.transmission} onChange={v=>set("transmission")(v)}/></Field>
              <Field label="Anhængerled?" hint="valgfrit"><SingleChips options={["Ja, vigtigt","Rart at have","Nej tak"]} value={form.towbar} onChange={v=>set("towbar")(v)}/></Field>
            </div>}

            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:32}}>
              {step>0 ? <button onClick={()=>setStep(s=>s-1)} style={{background:"transparent",border:`1px solid ${C.border2}`,color:C.muted,padding:"10px 20px",borderRadius:8,cursor:"pointer"}}>← Tilbage</button> : <div/>}
              {step<4
                ? <button onClick={()=>setStep(s=>s+1)} disabled={!canNext(step)} style={{...commonButton,background:canNext(step)?C.gold:C.border,color:canNext(step)?"#000":C.dim,cursor:canNext(step)?"pointer":"default"}}>Næste →</button>
                : <button onClick={()=>runSearch([[],[]])} style={commonButton}>Find vores bil ✨</button>}
            </div>

            {error && <p style={{color:C.red,fontSize:12,textAlign:"center",marginTop:14}}>{error}</p>}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<React.StrictMode><App/></React.StrictMode>);
  </script>
</body>
</html>
