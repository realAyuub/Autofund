<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Autofund — uafhængig bilrådgivning</title>
  <meta name="description" content="Vi spørger om din hverdag, ikke om hestekræfter, og finder to biler der passer. Gratis, uafhængigt og kun danske biler."/>
  <meta name="theme-color" content="#faf9f5"/>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23faf9f5'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23b4552f' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,550;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{
      font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
      font-size:17px;line-height:1.55;background:#faf9f5;color:#211f1b;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
      text-rendering:optimizeLegibility;
    }
    a{color:inherit;text-decoration:none}
    button,input,textarea,select{font-family:inherit;font-size:inherit}
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    input[type=number]{-moz-appearance:textfield}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-thumb{background:#d8d2c4;border-radius:8px}
    /* Synlig tastaturfokus — vigtigt for tilgængelighed */
    :focus-visible{outline:2.5px solid #b4552f;outline-offset:3px;border-radius:8px}
    table{border-collapse:collapse}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* Respekter brugere der har slået animationer fra i systemet */
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- Bygget bundle: React + appen i én fil. Se README for hvordan den bygges igen. -->
  <script src="/app.js" defer></script>
</body>
</html>
