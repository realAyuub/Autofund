<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BilFinder — uafhængig bilrådgivning</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;font-size:17px;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    button,input,textarea{font-family:'DM Sans',sans-serif}
    input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
    ::-webkit-scrollbar{width:10px}
    ::-webkit-scrollbar-thumb{background:#b9c2d0;border-radius:8px}
    /* Synlig tastaturfokus — vigtigt for tilgængelighed */
    :focus-visible{outline:3px solid #0b5cd5;outline-offset:2px;border-radius:6px}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect, useMemo, createContext, useContext } = React;

    /* ─────────────────────────────────────────────────────────────
       KONFIGURATION — ret disse værdier ét sted
       ───────────────────────────────────────────────────────────── */
    const CONTACT_EMAIL = "Bilfinder@support.dk";     // modtager af kontakt + forespørgsler
    const COMPANY_NAME  = "BilFinder";
    const BILBASEN_BASE = "https://www.bilbasen.dk/brugt/bil";
    const FDM_SEARCH    = q => `https://www.fdm.dk/soeg?query=${encodeURIComponent(q)}`;

    /* ── Mærker: hele det danske marked, søgbart ── */
    const BRANDS = ["Abarth","Aiways","Alfa Romeo","Alpine","Aston Martin","Audi","Bentley","BMW","BYD","Cadillac","Chevrolet","Chrysler","Citroën","Cupra","Dacia","Daihatsu","Dodge","DS Automobiles","Ferrari","Fiat","Ford","Genesis","GWM","Honda","Hongqi","Hyundai","Isuzu","Jaecoo","Jaguar","Jeep","Kia","Lada","Lamborghini","Lancia","Land Rover","Leapmotor","Lexus","Lotus","Maserati","Maxus","Mazda","McLaren","Mercedes-Benz","MG","Mini","Mitsubishi","NIO","Nissan","Omoda","Opel","Peugeot","Polestar","Porsche","Renault","Rolls-Royce","Rover","Saab","Seat","Seres","Skoda","Skywell","Smart","SsangYong","Subaru","Suzuki","Tesla","Toyota","VinFast","Volkswagen","Volvo","Xpeng","Zeekr"];

    const BODY_TYPES = ["Hatchback","Sedan","Stationcar","SUV","MPV","Cabriolet","Pickup","Coupe"];
    const FUEL_TYPES = ["Benzin","Diesel","El","Hybrid","Plugin-hybrid"];
    const REGIONS = ["Hele Danmark","Sjælland","Fyn","Jylland","København og omegn","Aarhus","Odense"];
    const PRIORITIES = ["Lavt brændstofforbrug","God gensalgsværdi","Pålidelig motor","Lave serviceomkostninger","Sikkerhed","Komfort","Stort bagagerum","Teknologi & skærme","Ladetid","Plads til familien","Lav forsikring","Firehjulstræk","Sporty køreoplevelse","Høj motoreffekt"];
    const CHARACTERS = ["Familiebil","Praktisk & økonomisk","Komfort & luksus","Sporty / performance","Offroad / 4x4"];

    const STEPS = [
      {id:"family", label:"Familie",    icon:"👨‍👩‍👧", title:"Fortæl om familien",  sub:"Hvem skal bruge bilen?"},
      {id:"economy",label:"Økonomi",    icon:"💰",     title:"Økonomi",             sub:"Hvad er jeres budget?"},
      {id:"usage",  label:"Brug",       icon:"🛣️",     title:"Daglig brug",         sub:"Hvordan bruges bilen til hverdag?"},
      {id:"type",   label:"Biltype",    icon:"🚗",     title:"Biltype og mærke",    sub:"Hvad forestiller I jer?"},
      {id:"prefs",  label:"Ønsker",     icon:"⭐",     title:"Hvad er vigtigst?",   sub:"Vælg hvad der betyder mest for jer."},
      {id:"results",label:"Resultater", icon:"✨",     title:"Resultater",          sub:""},
    ];

    /* Bilbasen-koder, verificeret mod rigtige Bilbasen-URL'er:
       karosseri er navne (cartypes=MPV), brændstof er tal (fuel=2 = diesel).
       Ændrer Bilbasen deres parametre, rettes det her. */
    const BB_FUEL = {Benzin:"1",Diesel:"2",Hybrid:"3","Plugin-hybrid":"4",El:"5"};
    const BB_BODY = {Hatchback:"Hatchback",Sedan:"Sedan",Stationcar:"Stationcar",Cabriolet:"Cabriolet",Pickup:"Pickup",MPV:"MPV",Coupe:"Coupe",SUV:"SUV"};
    /* Bilbasen bruger korte navne i mærke-stien (/brugt/bil/vw, ikke /volkswagen)
       med bindestreg i mærker (/alfa-romeo/giulia) og underscore i modeller (/renault/megane_iv) */
    const SLUG_OVERRIDES = {"Volkswagen":"vw","Mercedes-Benz":"mercedes","DS Automobiles":"ds","Land Rover":"land-rover","Alfa Romeo":"alfa-romeo","Aston Martin":"aston-martin","Rolls-Royce":"rolls-royce","VinFast":"vinfast","MG":"mg","BMW":"bmw","BYD":"byd","GWM":"gwm","NIO":"nio","DS":"ds"};

    const slugify = (s, sep="_") => (s||"").toString().trim().toLowerCase()
      .replace(/æ/g,"ae").replace(/ø/g,"oe").replace(/å/g,"aa")
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]+/g,sep)
      .replace(sep==="_"?/^_+|_+$/g:/^-+|-+$/g,"");
    const brandSlug = b => SLUG_OVERRIDES[b] || slugify(b,"-");

    const fmtDKK = n => (n===null||n===undefined||isNaN(n)) ? "–" : new Intl.NumberFormat("da-DK").format(Math.round(n)) + " kr.";
    const num = v => { const n = parseInt(String(v).replace(/\D/g,""),10); return isNaN(n)?null:n; };

    /* ─────────────────────────────────────────────────────────────
       TEMAER — lyst er standard, mørkt kan slås til
       ───────────────────────────────────────────────────────────── */
    const THEMES = {
      light: {
        id:"light",
        bg:"#f2f5f9", surface:"#ffffff", surface2:"#eef2f8", panel:"#f7f9fc",
        border:"#dfe5ee", border2:"#c8d2e0",
        text:"#0f1722", muted:"#48546a", dim:"#6b7789",
        accent:"#0b5cd5", accentSoft:"#e7f0fe", accentBorder:"#a9c6f5", onAccent:"#ffffff",
        good:"#0f7a3d", bad:"#c1362b", info:"#0a6a86",
        shadow:"0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06)",
        shadowLift:"0 2px 4px rgba(11,92,213,.10), 0 12px 32px rgba(11,92,213,.14)",
      },
      dark: {
        id:"dark",
        bg:"#07090f", surface:"#0d1117", surface2:"#161b22", panel:"#0b0e14",
        border:"#1c222c", border2:"#2b323d",
        text:"#e9eef5", muted:"#9aa5b4", dim:"#7c8794",
        accent:"#e3b96a", accentSoft:"#e3b96a1f", accentBorder:"#e3b96a55", onAccent:"#0b0e14",
        good:"#4ac26b", bad:"#ff6b5e", info:"#6cb6ff",
        shadow:"0 8px 28px rgba(0,0,0,.45)",
        shadowLift:"0 0 44px rgba(227,185,106,.16)",
      },
    };
    const ThemeCtx = createContext(THEMES.light);
    const useC = () => useContext(ThemeCtx);

    /* ─────────────────────────────────────────────────────────────
       PROFIL TIL AI
       ───────────────────────────────────────────────────────────── */
    function buildProfile(f, rank, exclude, avoidCar) {
      const budget = f.budgetType==="kontant"
        ? `${fmtDKK(num(f.budget))} kontant (MAKS — foreslå ikke dyrere)`
        : `${fmtDKK(num(f.monthly))}/md (MAKS)`;
      const lines = [
        `Familie: ${f.adults} voksne, ${f.children} børn${f.childAges?` (aldre: ${f.childAges})`:""}`,
        `Region: ${f.region||"hele Danmark"}`,
        `Budget: ${budget}`,
        `Daglig km: ${f.dailyKm||"ukendt"} — kørsel: ${f.driveType||"blandet"}`,
        `Drivmiddel: ${(f.fuels||[]).join(", ")||"ingen præference"}`,
        `Karosseri: ${(f.bodies||[]).join(", ")||"ingen præference"}`,
        `Bilens karakter: ${f.character||"ingen præference"}`,
        `Foretrukne mærker: ${(f.brands||[]).join(", ")||"ingen præference"}`,
        `Uønskede mærker: ${[...(f.excludeBrands||[])].join(", ")||"ingen"}`,
        `Årgang fra: ${f.yearMin||"ingen krav"} — maks km: ${f.kmMax||"ingen krav"}`,
        `Ønsket minimum effekt: ${f.minHp?f.minHp+" hk":"ingen krav"}`,
        `Ønsket udstyrs-/motorvariant: ${f.variantWish||"ingen"}`,
        `Gearkasse: ${f.transmission||"ligemeget"} — anhængertræk: ${f.towbar||"ikke oplyst"}`,
        `Prioriteter: ${(f.priorities||[]).join(", ")||"ingen"}`,
        `Særlige behov: ${f.extras||"ingen"}`,
      ];
      const hard = [];
      if ((f.brands||[]).length) hard.push(`Bilen SKAL være af et af disse mærker: ${f.brands.join(" eller ")}.`);
      if (f.variantWish) hard.push(`Brugeren har eksplicit bedt om varianten "${f.variantWish}" — anbefal en model der findes i netop den variant, og skriv den præcise variantbetegnelse i "variant" og "bilbasen_search_term".`);
      if (f.minHp) hard.push(`Motoren SKAL yde mindst ${f.minHp} hk.`);
      if (f.character==="Sporty / performance") hard.push(`Brugeren vil have en SPORTSLIG bil (f.eks. vRS, RS, GTI, ST, N, AMG, M-pakke, Cupra) — ikke en almindelig familiebil.`);
      if ((f.fuels||[]).length) hard.push(`Drivmiddel skal være: ${f.fuels.join(" eller ")}.`);
      if ((f.bodies||[]).length) hard.push(`Karosseri skal være: ${f.bodies.join(" eller ")}.`);
      if ((f.excludeBrands||[]).length) hard.push(`Må ALDRIG være: ${f.excludeBrands.join(", ")}.`);

      const rankTxt = rank===2
        ? `Dette er FORSLAG 2 (alternativet). Det SKAL være et markant anderledes valg end forslag 1 — vælg et andet mærke OG enten anden karosseriform eller andet drivmiddel. Forklar i "differs_from_primary" med én sætning hvad der konkret adskiller den fra ${avoidCar||"forslag 1"}.`
        : `Dette er FORSLAG 1 — det bedste samlede match.`;

      return [
        lines.join("\n"),
        hard.length ? `\nHÅRDE KRAV (må ikke brydes):\n- ${hard.join("\n- ")}` : "",
        `\n${rankTxt}`,
        `Foreslå ALDRIG disse biler: ${(exclude||[]).join("; ")||"ingen"}`,
      ].join("\n");
    }

    /* ─────────────────────────────────────────────────────────────
       BILBASEN-LINKS — præcise søgninger
       ───────────────────────────────────────────────────────────── */
    function priceBand(car, form, pct) {
      const p = num(car.price_used_dkk);
      if (!p) return [null,null];
      let lo = Math.round(p*(1-pct/100));
      let hi = Math.round(p*(1+pct/100));
      const budget = num(form.budget);
      if (budget) hi = Math.min(hi, budget);            // aldrig over brugerens budget
      lo = Math.max(0, Math.min(lo, hi));
      return [Math.round(lo/1000)*1000, Math.round(hi/1000)*1000];
    }
    function yearBand(car, form) {
      const r = String(car.year_range||"");
      const m = r.match(/(\d{4})\D+(\d{4})/);
      let from = num(car.year_from) || (m?parseInt(m[1],10):num(r.slice(0,4)));
      let to   = num(car.year_to)   || (m?parseInt(m[2],10):null);
      const userMin = num(form.yearMin);
      if (userMin) from = Math.max(from||userMin, userMin);
      return [from, to];
    }
    /* Bilbasen-parametre bekræftet mod rigtige URL'er:
       pricefrom/priceto, yearfrom/yearto, mileageto, fuel (tal), cartypes (navn),
       hpfrom/hpto, free (fritekst). includeleasing og
       includewithoutvehicleregistrationtax slås FRA, fordi leasingannoncer viser
       månedsydelser og afgiftsfrie biler viser priser uden registreringsafgift —
       begge dele ødelægger en søgning på prisinterval. */
    function baseParams(form, car, priceLo, priceHi) {
      const p = new URLSearchParams();
      if (priceLo) p.set("pricefrom", priceLo);
      if (priceHi) p.set("priceto", priceHi);
      const [yf,yt] = yearBand(car||{}, form);
      if (yf) p.set("yearfrom", yf);
      if (yt) p.set("yearto", yt);
      if (num(form.kmMax)) p.set("mileageto", num(form.kmMax));
      if (num(form.minHp)) p.set("hpfrom", num(form.minHp));
      p.set("includeleasing", "false");
      p.set("includewithoutvehicleregistrationtax", "false");
      return p;
    }
    /* Er modelnavnet ét ord, kan det stå i stien (/skoda/octavia).
       Er det flere ord, er sti-formen usikker — så ryger modellen i fritekst i stedet. */
    function modelPathAndText(car) {
      const raw = car.bilbasen_model_slug || slugify(car.model);
      const oneWord = raw && !raw.includes("_");
      return { path: oneWord ? raw : "", text: oneWord ? "" : (car.model||"") };
    }
    /* Præcis søgning: mærke (+ model) i stien, resten som filtre */
    function buildBilbasenModelUrl(form, car, pct=5) {
      const bs = car.bilbasen_brand_slug || brandSlug(car.brand);
      const { path: ms, text: modelText } = modelPathAndText(car);
      const [lo,hi] = priceBand(car, form, pct);
      const p = baseParams(form, car, lo, hi);
      const fuels = (form.fuels||[]).length ? form.fuels : (car.fuel_type?[car.fuel_type]:[]);
      fuels.forEach(f=>{ if(BB_FUEL[f]) p.append("fuel", BB_FUEL[f]); });
      // Brugerens variantønske må kun bruges hvis bilen faktisk fås i den variant —
      // ellers ender et "vRS"-ønske som fritekst på en Tesla og giver nul resultater.
      const wish = form.variantWish && String(car.variant||"").toLowerCase().includes(form.variantWish.toLowerCase())
        ? form.variantWish : "";
      const term = [modelText, car.bilbasen_search_term || wish].filter(Boolean).join(" ").trim();
      if (term) p.set("free", term);
      return `${BILBASEN_BASE}/${bs}${ms?`/${ms}`:""}?${p.toString()}`;
    }
    /* Bredere søgning i samme klasse — stadig filtreret, ikke "alle biler" */
    function buildBilbasenBroadUrl(form, car) {
      const budget = num(form.budget) || (num(car&&car.price_used_dkk) ? Math.round(num(car.price_used_dkk)*1.1) : null);
      const p = baseParams(form, car, null, budget);
      const fuels = (form.fuels||[]).length ? form.fuels : (car&&car.fuel_type?[car.fuel_type]:[]);
      fuels.forEach(f=>{ if(BB_FUEL[f]) p.append("fuel", BB_FUEL[f]); });
      const bodies = (form.bodies||[]).length ? form.bodies : (car&&car.body_type?[car.body_type]:[]);
      bodies.forEach(b=>{ if(BB_BODY[b]) p.append("cartypes", BB_BODY[b]); });
      return `${BILBASEN_BASE}?${p.toString()}`;
    }

    async function fetchOneCar(profile) {
      const res = await fetch("/api/mistral", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ profile }),
      });
      if (!res.ok) throw new Error("API fejl " + res.status);
      const data = await res.json();
      const text = data.choices?.[0]?.message?.content || "";
      const s = text.indexOf("{"), e = text.lastIndexOf("}");
      if (s === -1 || e === -1) throw new Error("Intet JSON");
      const parsed = JSON.parse(text.slice(s, e+1));
      if (!parsed.brand) throw new Error("Mangler brand");
      return parsed;
    }
    const carKey = c => c ? `${(c.brand||"").toLowerCase()} ${(c.model||"").toLowerCase()}`.trim() : "";

    /* ─────────────────────────────────────────────────────────────
       UI-BYGGEKLODSER
       ───────────────────────────────────────────────────────────── */
    function Chip({label,active,onClick}) {
      const C = useC();
      return <button onClick={onClick} aria-pressed={active} style={{
        padding:"11px 18px", minHeight:44, borderRadius:9,
        border:`2px solid ${active?C.accent:C.border2}`,
        background:active?C.accentSoft:C.surface, color:active?C.accent:C.text,
        fontSize:15, cursor:"pointer", fontWeight:active?700:500, whiteSpace:"nowrap"}}>{label}</button>;
    }
    function MultiChips({options,value=[],onChange}) {
      return <div style={{display:"flex",flexWrap:"wrap",gap:8}}>{options.map(o=>
        <Chip key={o} label={o} active={value.includes(o)} onClick={()=>onChange(value.includes(o)?value.filter(v=>v!==o):[...value,o])}/>)}</div>;
    }
    function SingleChips({options,value,onChange}) {
      return <div style={{display:"flex",flexWrap:"wrap",gap:8}}>{options.map(o=>
        <Chip key={o} label={o} active={value===o} onClick={()=>onChange(value===o?"":o)}/>)}</div>;
    }

    /* Søgbar multi-dropdown: skriv for at finde, eller vælg på listen */
    function SearchableMultiSelect({value=[],onChange,options,placeholder,allowCustom=true}) {
      const C = useC();
      const [open,setOpen] = useState(false);
      const [q,setQ] = useState("");
      const ref = useRef(null), inputRef = useRef(null);
      useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target)){setOpen(false);setQ("");}};
        document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);},[]);
      useEffect(()=>{ if(open&&inputRef.current) inputRef.current.focus(); },[open]);
      const norm = s => s.toLowerCase().replace(/ø/g,"o").replace(/æ/g,"ae").replace(/å/g,"a").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      const matches = useMemo(()=>{ const n=norm(q.trim()); return n ? options.filter(o=>norm(o).includes(n)) : options; },[q,options]);
      const exact = options.some(o=>norm(o)===norm(q.trim()));
      const toggle = o => onChange(value.includes(o)?value.filter(v=>v!==o):[...value,o]);
      const addCustom = () => { const t=q.trim(); if(t&&!value.includes(t)){onChange([...value,t]);} setQ(""); };

      return <div ref={ref} style={{position:"relative"}}>
        {value.length>0 && <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
          {value.map(v=><span key={v} style={{display:"inline-flex",alignItems:"center",gap:7,background:C.accentSoft,border:`1px solid ${C.accentBorder}`,color:C.accent,borderRadius:20,padding:"6px 8px 6px 14px",fontSize:14,fontWeight:600}}>
            {v}<button onClick={()=>toggle(v)} aria-label={`Fjern ${v}`} style={{border:"none",background:"transparent",color:C.accent,cursor:"pointer",fontSize:16,lineHeight:1,padding:"0 4px"}}>×</button>
          </span>)}
        </div>}
        <div onClick={()=>setOpen(true)} style={{display:"flex",alignItems:"center",gap:8,background:C.surface,border:`2px solid ${open?C.accent:C.border2}`,borderRadius:10,padding:"4px 12px",minHeight:52,cursor:"text"}}>
          <span aria-hidden="true" style={{color:C.dim,fontSize:16}}>🔍</span>
          <input ref={inputRef} type="text" value={q} onChange={e=>{setQ(e.target.value);setOpen(true);}}
            onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); if(matches.length===1) toggle(matches[0]); else if(allowCustom&&!exact) addCustom(); } if(e.key==="Escape") setOpen(false); }}
            placeholder={placeholder} aria-label={placeholder}
            style={{flex:1,border:"none",outline:"none",background:"transparent",color:C.text,fontSize:16,padding:"12px 0"}}/>
          <span style={{color:C.dim,fontSize:12}}>{open?"▲":"▼"}</span>
        </div>
        {open && <div style={{position:"absolute",top:"calc(100% + 6px)",left:0,right:0,zIndex:300,background:C.surface,border:`1px solid ${C.border2}`,borderRadius:10,boxShadow:C.shadow,maxHeight:300,overflowY:"auto"}}>
          {matches.length===0 && !allowCustom && <div style={{padding:"14px 16px",color:C.muted,fontSize:15}}>Ingen match</div>}
          {/* Kun tilbyd fritekst når intet mærke matcher — ellers forvirrer det valget */}
          {allowCustom && q.trim() && !exact && matches.length===0 && <div onClick={addCustom} style={{padding:"13px 16px",color:C.accent,fontSize:15,fontWeight:700,cursor:"pointer",borderBottom:`1px solid ${C.border}`}}>+ Tilføj “{q.trim()}” alligevel</div>}
          {matches.map(o=><div key={o} onClick={()=>toggle(o)} role="option" aria-selected={value.includes(o)}
            style={{padding:"12px 16px",color:value.includes(o)?C.accent:C.text,fontSize:16,cursor:"pointer",background:value.includes(o)?C.accentSoft:"transparent",display:"flex",alignItems:"center",gap:12}}
            onMouseEnter={e=>{if(!value.includes(o))e.currentTarget.style.background=C.surface2}}
            onMouseLeave={e=>{if(!value.includes(o))e.currentTarget.style.background="transparent"}}>
            <span style={{width:20,height:20,borderRadius:5,border:`2px solid ${value.includes(o)?C.accent:C.border2}`,background:value.includes(o)?C.accent:"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:C.onAccent,flexShrink:0}}>{value.includes(o)?"✓":""}</span>
            {o}
          </div>)}
        </div>}
      </div>;
    }

    function SingleDropdown({value,onChange,options,placeholder}) {
      const C = useC();
      const [open,setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
        document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);},[]);
      return <div ref={ref} style={{position:"relative"}}>
        <button onClick={()=>setOpen(!open)} style={{width:"100%",minHeight:52,background:C.surface,border:`2px solid ${open?C.accent:C.border2}`,borderRadius:10,padding:"12px 16px",color:value?C.text:C.dim,fontSize:16,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span>{value||placeholder}</span><span style={{color:C.muted,fontSize:12}}>▼</span>
        </button>
        {open && <div style={{position:"absolute",top:"calc(100% + 6px)",left:0,right:0,zIndex:300,background:C.surface,border:`1px solid ${C.border2}`,borderRadius:10,boxShadow:C.shadow,maxHeight:280,overflowY:"auto"}}>
          <div onClick={()=>{onChange("");setOpen(false);}} style={{padding:"12px 16px",color:C.muted,fontSize:16,cursor:"pointer"}}>Ingen præference</div>
          {options.map(o=><div key={o} onClick={()=>{onChange(o);setOpen(false);}}
            style={{padding:"12px 16px",color:value===o?C.accent:C.text,fontSize:16,cursor:"pointer",background:value===o?C.accentSoft:"transparent"}}
            onMouseEnter={e=>{if(value!==o)e.currentTarget.style.background=C.surface2}}
            onMouseLeave={e=>{if(value!==o)e.currentTarget.style.background="transparent"}}>{o}</div>)}
        </div>}
      </div>;
    }

    function NumInput({value,onChange,placeholder,suffix,label}) {
      const C = useC();
      return <div style={{position:"relative"}}>
        <input type="number" value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} aria-label={label||placeholder}
          style={{width:"100%",minHeight:52,background:C.surface,border:`2px solid ${C.border2}`,borderRadius:10,padding:`12px ${suffix?"78px":"16px"} 12px 16px`,color:C.text,fontSize:16,outline:"none"}}
          onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border2}/>
        {suffix && <span style={{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)",color:C.muted,fontSize:14,pointerEvents:"none"}}>{suffix}</span>}
      </div>;
    }
    function TxtInput({value,onChange,placeholder,label,type="text"}) {
      const C = useC();
      return <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} aria-label={label||placeholder}
        style={{width:"100%",minHeight:52,background:C.surface,border:`2px solid ${C.border2}`,borderRadius:10,padding:"12px 16px",color:C.text,fontSize:16,outline:"none"}}
        onFocus={e=>e.target.style.borderColor=C.accent} onBlur={e=>e.target.style.borderColor=C.border2}/>;
    }
    function Field({label,hint,children,help}) {
      const C = useC();
      return <div style={{marginBottom:26}}>
        <div style={{marginBottom:10}}>
          <span style={{color:C.text,fontSize:16,fontWeight:700}}>{label}</span>
          {hint && <span style={{color:C.muted,fontSize:14,marginLeft:10}}>{hint}</span>}
        </div>
        {help && <p style={{color:C.muted,fontSize:14,marginBottom:10,lineHeight:1.5}}>{help}</p>}
        {children}
      </div>;
    }
    function Btn({children,onClick,kind="primary",size="md",full,disabled,as,href,...rest}) {
      const C = useC();
      const pads = {sm:"10px 16px", md:"14px 26px", lg:"16px 30px"};
      const fs = {sm:14, md:16, lg:17};
      const base = {display:"inline-flex",alignItems:"center",justifyContent:"center",gap:9,minHeight:size==="sm"?42:52,
        padding:pads[size],borderRadius:10,fontSize:fs[size],fontWeight:700,cursor:disabled?"default":"pointer",
        border:"2px solid transparent",width:full?"100%":"auto",textAlign:"center"};
      const kinds = {
        primary:{background:disabled?C.border:C.accent,color:disabled?C.dim:C.onAccent,boxShadow:disabled?"none":C.shadow},
        ghost:{background:C.surface,color:C.text,borderColor:C.border2},
        quiet:{background:"transparent",color:C.muted,borderColor:"transparent"},
      };
      const style = {...base,...kinds[kind]};
      if (as==="a") return <a href={href} style={style} {...rest}>{children}</a>;
      return <button onClick={onClick} disabled={disabled} style={style} {...rest}>{children}</button>;
    }

    /* ─────────────────────────────────────────────────────────────
       STEP-BJÆLKE — altid synlig, centreret, klikbar tilbage
       ───────────────────────────────────────────────────────────── */
    function Stepper({step,maxReached,onGo}) {
      const C = useC();
      return <nav aria-label="Trin i søgningen" style={{position:"sticky",top:0,zIndex:120,background:C.surface,borderBottom:`1px solid ${C.border}`,boxShadow:C.shadow}}>
        <div style={{maxWidth:820,margin:"0 auto",padding:"14px 14px 12px"}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"center"}}>
            {STEPS.map((s,i)=>{
              const done = i<step, current = i===step, clickable = i<=maxReached && i!==step;
              const color = current?C.accent : done?C.accent : C.dim;
              return <div key={s.id} style={{display:"flex",alignItems:"flex-start",flex:i<STEPS.length-1?1:"none",minWidth:0}}>
                <button onClick={()=>clickable&&onGo(i)} disabled={!clickable} aria-current={current?"step":undefined}
                  title={clickable?`Gå tilbage til “${s.label}”`:s.label}
                  style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,background:"transparent",border:"none",
                    cursor:clickable?"pointer":"default",padding:"2px 4px",minWidth:56}}>
                  <span style={{width:44,height:44,borderRadius:"50%",flexShrink:0,
                    background:done?C.accent:current?C.accentSoft:"transparent",
                    border:`2px solid ${done||current?C.accent:C.border2}`,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:done?18:20,color:done?C.onAccent:color,
                    boxShadow:current?`0 0 0 4px ${C.accentSoft}`:"none"}}>{done?"✓":s.icon}</span>
                  <span style={{fontSize:13,fontWeight:current?800:600,color:current?C.accent:done?C.muted:C.dim,whiteSpace:"nowrap"}}>{s.label}</span>
                </button>
                {i<STEPS.length-1 && <div aria-hidden="true" style={{flex:1,height:3,borderRadius:3,margin:"22px 4px 0",background:done?C.accent:C.border,minWidth:8}}/>}
              </div>;
            })}
          </div>
          {step>0 && <div style={{textAlign:"center",marginTop:8}}>
            <button onClick={()=>onGo(step-1)} style={{background:"transparent",border:"none",color:C.accent,fontSize:15,fontWeight:700,cursor:"pointer",padding:"6px 12px",minHeight:40}}>
              ← Tilbage til “{STEPS[step-1].label}”
            </button>
          </div>}
        </div>
      </nav>;
    }

    /* ─────────────────────────────────────────────────────────────
       RESULTAT-VISNING
       ───────────────────────────────────────────────────────────── */
    function Sparkline({resale,price}) {
      const C = useC();
      const gid = useRef("sg"+Math.random().toString(36).slice(2,8)).current;
      const r = resale||{};
      const all=[price,r.y1,r.y2,r.y3,r.y4,r.y5,r.y6,r.y7,r.y8].map(v=>num(v)).filter(v=>v!==null);
      if(all.length<3) return null;
      const mn=Math.min(...all)*0.92,mx=Math.max(...all),rng=(mx-mn)||1,W=300,H=64;
      const x=i=>(i/(all.length-1))*W, y=v=>H-((v-mn)/rng)*H;
      const pts=all.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
      return <svg width="100%" viewBox={`0 0 ${W} ${H+22}`} style={{overflow:"visible"}} role="img" aria-label="Forventet gensalgsværdi over 8 år">
        <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={C.accent} stopOpacity="0.28"/><stop offset="100%" stopColor={C.accent} stopOpacity="0"/></linearGradient></defs>
        <path d={`M ${pts.split(" ").join(" L ")} L ${W} ${H+8} L 0 ${H+8} Z`} fill={`url(#${gid})`}/>
        <polyline points={pts} fill="none" stroke={C.accent} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/>
        {all.map((v,i)=>i%2===0&&<g key={i}><circle cx={x(i)} cy={y(v)} r="3.5" fill={C.accent}/><text x={x(i)} y={H+18} textAnchor="middle" fill={C.muted} fontSize="11">{i===0?"Nu":`år ${i}`}</text></g>)}
      </svg>;
    }

    function Panel({title,children,tone}) {
      const C = useC();
      return <div style={{background:tone==="accent"?C.accentSoft:C.panel,border:`1px solid ${tone==="accent"?C.accentBorder:C.border}`,borderRadius:12,padding:"14px 16px",marginBottom:12}}>
        {title && <div style={{color:C.muted,fontSize:12,textTransform:"uppercase",letterSpacing:1,fontWeight:800,marginBottom:10}}>{title}</div>}
        {children}
      </div>;
    }

    function DisclaimerBox() {
      const C = useC();
      const [open,setOpen]=useState(false);
      return <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginTop:26,boxShadow:C.shadow}}>
        <button onClick={()=>setOpen(!open)} style={{width:"100%",background:"none",border:"none",padding:"16px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",minHeight:56}}>
          <span style={{color:C.text,fontSize:15,fontWeight:700,display:"flex",alignItems:"center",gap:8}}><span style={{color:C.accent}}>ℹ</span> Hvor kommer tallene og anmeldelserne fra?</span>
          <span style={{color:C.muted,fontSize:13,transform:open?"rotate(180deg)":"none",transition:"transform .2s"}}>▼</span>
        </button>
        {open && <div style={{padding:"0 18px 18px",borderTop:`1px solid ${C.border}`}}>
          <div style={{color:C.muted,fontSize:15,lineHeight:1.8,paddingTop:14}}>
            <p style={{marginBottom:10,color:C.text,fontWeight:700}}>Estimater — ikke garantier</p>
            <p style={{marginBottom:10}}>Priser og gensalgsværdier er <strong style={{color:C.text}}>estimater</strong> baseret på historiske markedsdata og bør ikke stå alene som grundlag for en økonomisk beslutning.</p>
            <p style={{marginBottom:10}}><strong style={{color:C.text}}>Anmeldelser og brugsvurderinger</strong> vægter <a href="https://www.fdm.dk" target="_blank" rel="noopener noreferrer" style={{color:C.accent,textDecoration:"underline"}}>FDM</a>’s tests og medlemsundersøgelser højest, fordi de er lavet ud fra danske forhold, danske priser og dansk afgiftsstruktur.</p>
            <p style={{marginBottom:10}}><strong style={{color:C.text}}>Sikkerhed</strong> bygger på Euro NCAP — se <a href="https://www.euroncap.com" target="_blank" rel="noopener noreferrer" style={{color:C.accent,textDecoration:"underline"}}>euroncap.com</a>.</p>
            <p><strong style={{color:C.text}}>Pålidelighed</strong> bygger på FDM’s fejlstatistik suppleret med ADAC Pannenstatistik og TÜV-rapporten.</p>
          </div>
        </div>}
      </div>;
    }

    /* Sammenligning: gør forskellen på de to forslag tydelig */
    function CompareBox({a,b}) {
      const C = useC();
      if(!a||!b) return null;
      const rows = [
        ["Bil", `${a.brand} ${a.model}`, `${b.brand} ${b.model}`],
        ["Variant", a.variant||"–", b.variant||"–"],
        ["Pris brugt", fmtDKK(num(a.price_used_dkk)), fmtDKK(num(b.price_used_dkk))],
        ["Drivmiddel", a.fuel_type||"–", b.fuel_type||"–"],
        ["Karosseri", a.body_type||"–", b.body_type||"–"],
        ["Effekt", a.hp?`${a.hp} hk`:"–", b.hp?`${b.hp} hk`:"–"],
        ["Brændstof/md.", fmtDKK(num(a.fuel_cost_monthly)), fmtDKK(num(b.fuel_cost_monthly))],
        ["Værdi efter 8 år", fmtDKK(num(a.resale?.y8)), fmtDKK(num(b.resale?.y8))],
      ];
      return <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,padding:"18px",marginTop:14,boxShadow:C.shadow}}>
        <h3 style={{fontFamily:"'Sora',sans-serif",fontSize:18,fontWeight:800,color:C.text,marginBottom:4}}>Forskellen på de to forslag</h3>
        {b.differs_from_primary && <p style={{color:C.muted,fontSize:15,lineHeight:1.6,marginBottom:12}}>{b.differs_from_primary}</p>}
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:15,minWidth:420}}>
            <thead><tr>
              <th style={{textAlign:"left",padding:"8px 10px",color:C.dim,fontSize:12,textTransform:"uppercase",letterSpacing:.6}}></th>
              <th style={{textAlign:"left",padding:"8px 10px",color:C.accent,fontSize:13,fontWeight:800}}>🏆 Bedste match</th>
              <th style={{textAlign:"left",padding:"8px 10px",color:C.muted,fontSize:13,fontWeight:800}}>Alternativ</th>
            </tr></thead>
            <tbody>
              {rows.map(([l,x,y],i)=>{
                const same = String(x)===String(y);
                return <tr key={l} style={{background:i%2?C.panel:"transparent"}}>
                  <td style={{padding:"9px 10px",color:C.muted,fontWeight:600,whiteSpace:"nowrap"}}>{l}</td>
                  <td style={{padding:"9px 10px",color:same?C.muted:C.text,fontWeight:same?400:700}}>{x}</td>
                  <td style={{padding:"9px 10px",color:same?C.muted:C.text,fontWeight:same?400:700}}>{y}</td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>;
    }

    function CarCard({car,form,onReject,isAlt,loading}) {
      const C = useC();
      const [expanded,setExpanded]=useState(false);
      const [pct,setPct]=useState(5);
      if(loading) return <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:16,padding:"40px 24px",textAlign:"center",boxShadow:C.shadow}}>
        <div style={{display:"inline-block",width:26,height:26,border:`3px solid ${C.accentSoft}`,borderTopColor:C.accent,borderRadius:"50%",animation:"spin .8s linear infinite"}}/>
        <div style={{color:C.muted,fontSize:15,marginTop:14}}>Finder {isAlt?"alternativt forslag":"bedste match"}…</div>
      </div>;
      if(!car) return null;
      const price = num(car.price_used_dkk);
      const y8 = num(car.resale?.y8);
      const loss8 = (price!==null&&y8!==null) ? price-y8 : null;
      const [lo,hi] = priceBand(car, form, pct);
      const pros = Array.isArray(car.pros)?car.pros:[], cons = Array.isArray(car.cons)?car.cons:[];

      return <article style={{background:C.surface,border:`2px solid ${isAlt?C.border:C.accentBorder}`,borderRadius:16,overflow:"hidden",position:"relative",boxShadow:isAlt?C.shadow:C.shadowLift,animation:"fadeUp .35s ease"}}>
        <div style={{background:isAlt?C.surface2:C.accentSoft,padding:"10px 16px",borderBottom:`1px solid ${isAlt?C.border:C.accentBorder}`,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <span style={{color:isAlt?C.muted:C.accent,fontSize:13,fontWeight:800,letterSpacing:.8}}>{isAlt?"ALTERNATIVT FORSLAG":"🏆 BEDSTE MATCH"}</span>
          <span title="Forslaget er sammensat af vores AI ud fra dine svar" style={{background:C.surface,border:`1px solid ${C.border2}`,color:C.muted,fontSize:11,fontWeight:800,padding:"3px 9px",borderRadius:20,letterSpacing:.8}}>AI-ANALYSE</span>
          {onReject && <button onClick={onReject} style={{marginLeft:"auto",background:"transparent",border:`1px solid ${C.border2}`,color:C.muted,borderRadius:8,padding:"7px 12px",fontSize:13,fontWeight:600,cursor:"pointer",minHeight:38}}>✕ Vis et andet forslag</button>}
        </div>

        <div style={{padding:"20px 18px 0"}}>
          <div style={{marginBottom:16}}>
            <h3 style={{fontFamily:"'Sora',sans-serif",fontSize:25,fontWeight:800,color:C.text,lineHeight:1.15}}>{car.brand} {car.model}</h3>
            <div style={{color:C.muted,fontSize:15,marginTop:4}}>{[car.variant,car.year_range,car.hp?`${car.hp} hk`:null].filter(Boolean).join(" · ")}</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:18,marginTop:14}}>
              <div><div style={{color:C.dim,fontSize:11,textTransform:"uppercase",letterSpacing:.6,fontWeight:700}}>Brugt ca.</div><div style={{color:C.accent,fontSize:24,fontWeight:800}}>{fmtDKK(price)}</div></div>
              <div><div style={{color:C.dim,fontSize:11,textTransform:"uppercase",letterSpacing:.6,fontWeight:700}}>Nypris</div><div style={{color:C.muted,fontSize:17,fontWeight:700}}>{fmtDKK(num(car.price_new_dkk))}</div></div>
              <div><div style={{color:C.dim,fontSize:11,textTransform:"uppercase",letterSpacing:.6,fontWeight:700}}>Brændstof/md.*</div><div style={{color:C.info,fontSize:17,fontWeight:700}}>{fmtDKK(num(car.fuel_cost_monthly))}</div></div>
            </div>
          </div>

          <Panel title="Hvorfor denne bil?">
            {(Array.isArray(car.short_why)?car.short_why:[car.short_why]).filter(Boolean).map((pt,i)=>(
              <div key={i} style={{display:"flex",gap:9,marginBottom:8,alignItems:"flex-start"}}>
                <span style={{color:C.accent,fontSize:14,marginTop:3,flexShrink:0}}>→</span>
                <span style={{color:C.text,fontSize:16,lineHeight:1.55}}>{pt}</span>
              </div>))}
            <button onClick={()=>setExpanded(!expanded)} style={{background:"none",border:"none",color:C.accent,fontSize:15,fontWeight:700,cursor:"pointer",marginTop:6,padding:"6px 0",minHeight:40}}>{expanded?"▲ Skjul":"▼ Læs mere"}</button>
            {expanded && <p style={{color:C.text,fontSize:16,lineHeight:1.75,marginTop:6,paddingTop:12,borderTop:`1px solid ${C.border}`}}>{car.long_why}</p>}
          </Panel>

          {car.fdm_verdict && <Panel title="FDM’s vurdering" tone="accent">
            <p style={{color:C.text,fontSize:16,lineHeight:1.65,marginBottom:10}}>{car.fdm_verdict}</p>
            <a href={FDM_SEARCH(`${car.brand} ${car.model} test`)} target="_blank" rel="noopener noreferrer"
               style={{color:C.accent,fontSize:15,fontWeight:700,textDecoration:"underline"}}>Læs FDM’s test af {car.brand} {car.model} →</a>
          </Panel>}

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:10,marginBottom:12}}>
            <div style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:12,padding:14}}>
              <div style={{color:C.good,fontSize:12,fontWeight:800,textTransform:"uppercase",letterSpacing:.6,marginBottom:8}}>Fordele</div>
              {pros.map((p,i)=><div key={i} style={{display:"flex",gap:8,marginBottom:6}}><span style={{color:C.good,fontSize:14}}>✓</span><span style={{color:C.text,fontSize:15,lineHeight:1.5}}>{p}</span></div>)}
            </div>
            <div style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:12,padding:14}}>
              <div style={{color:C.bad,fontSize:12,fontWeight:800,textTransform:"uppercase",letterSpacing:.6,marginBottom:8}}>Ulemper</div>
              {cons.map((c,i)=><div key={i} style={{display:"flex",gap:8,marginBottom:6}}><span style={{color:C.bad,fontSize:14}}>✗</span><span style={{color:C.text,fontSize:15,lineHeight:1.5}}>{c}</span></div>)}
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:12}}>
            {[{l:"Sikkerhed",v:num(car.safety_rating)?"⭐".repeat(num(car.safety_rating)):"–"},
              {l:"Pålidelighed",v:car.reliability||"–"},
              {l:"Tab over 8 år*",v:loss8!==null?"−"+fmtDKK(loss8):"–",bad:true}].map(s=>
              <div key={s.l} style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px 14px"}}>
                <div style={{color:C.dim,fontSize:11,textTransform:"uppercase",letterSpacing:.6,fontWeight:700,marginBottom:5}}>{s.l}</div>
                <div style={{color:s.bad?C.bad:C.text,fontSize:16,fontWeight:700}}>{s.v}</div>
              </div>)}
          </div>

          <Panel title="Gensalgsværdi — 8 år*">
            <Sparkline resale={car.resale} price={price}/>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:6}}>
              <span style={{color:C.muted,fontSize:13}}>Nu: {fmtDKK(price)}</span>
              <span style={{color:C.muted,fontSize:13}}>År 8: {fmtDKK(y8)}</span>
            </div>
          </Panel>

          <div style={{background:C.panel,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 16px",marginBottom:12}}>
            <div style={{color:C.muted,fontSize:12,textTransform:"uppercase",letterSpacing:1,fontWeight:800,marginBottom:8}}>Søg på Bilbasen med præcis dette</div>
            <div style={{color:C.text,fontSize:15,lineHeight:1.7,marginBottom:10}}>
              {car.brand} {car.model}{car.variant?` ${car.variant}`:""} · årgang {(yearBand(car,form)[0]||"?")}{yearBand(car,form)[1]?`–${yearBand(car,form)[1]}`:""} · {(lo&&hi)?`${fmtDKK(lo)} – ${fmtDKK(hi)}`:"pris efter budget"}
              {num(form.kmMax)?` · maks ${new Intl.NumberFormat("da-DK").format(num(form.kmMax))} km`:""}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:12}}>
              <span style={{color:C.muted,fontSize:14,fontWeight:600}}>Prisspænd:</span>
              {[1,5,10,20].map(p=><button key={p} onClick={()=>setPct(p)} style={{padding:"7px 13px",minHeight:40,borderRadius:8,border:`2px solid ${pct===p?C.accent:C.border2}`,background:pct===p?C.accentSoft:C.surface,color:pct===p?C.accent:C.muted,fontSize:14,fontWeight:pct===p?800:600,cursor:"pointer"}}>±{p}%</button>)}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:9}}>
              <Btn as="a" href={buildBilbasenModelUrl(form,car,pct)} target="_blank" rel="noopener noreferrer" full>
                🔍 Se præcis denne bil på Bilbasen →
              </Btn>
              <Btn as="a" href={buildBilbasenBroadUrl(form,car)} target="_blank" rel="noopener noreferrer" kind="ghost" size="sm" full>
                Se lignende {car.fuel_type||""}-biler i samme klasse →
              </Btn>
            </div>
          </div>
          <p style={{color:C.dim,fontSize:13,textAlign:"center",paddingBottom:16}}>* Estimater — ikke garantier</p>
        </div>
      </article>;
    }

    /* ─────────────────────────────────────────────────────────────
       FORESPØRGSEL / HJÆLP — med kvittering, kønummer og svartid
       ───────────────────────────────────────────────────────────── */
    const SERVICES = [
      {id:"gratis", icon:"💬", title:"Stil et gratis spørgsmål", price:"Gratis", eta:"1–2 hverdage", desc:"Er du i tvivl om et af forslagene? Skriv til os, så svarer vi personligt.", tag:null},
      {id:"raad",   icon:"🎯", title:"Personlig rådgivning", price:"499 kr.", eta:"inden for 24 timer", desc:"En bilekspert gennemgår dine behov og finder de 5 bedste konkrete annoncer til dig.", tag:"Populær"},

        `Region: ${f.region||"ikke oplyst"}`,
        `Budget: ${f.budgetType==="kontant"?fmtDKK(num(f.budget))+" kontant":fmtDKK(num(f.monthly))+" pr. måned"}`,
        `Årgang fra: ${f.yearMin||"–"} · Maks km: ${f.kmMax||"–"} · Min. effekt: ${f.minHp?f.minHp+" hk":"–"}`,
        `Daglig kørsel: ${f.dailyKm||"–"} km (${f.driveType||"blandet"})`,
        `Karosseri: ${(f.bodies||[]).join(", ")||"–"} · Drivmiddel: ${(f.fuels||[]).join(", ")||"–"}`,
        `Karakter: ${f.character||"–"} · Ønsket variant: ${f.variantWish||"–"}`,
        `Foretrukne mærker: ${(f.brands||[]).join(", ")||"–"} · Fravalgte: ${(f.excludeBrands||[]).join(", ")||"–"}`,

      return `${label}: ${c.brand} ${c.model} ${c.variant||""} (${c.year_range||"?"}) — ca. ${fmtDKK(num(c.price_used_dkk))}${c.hp?`, ${c.hp} hk`:""}`;

    /* ─────────────────────────────────────────────────────────────

    function App() {
      const [themeId,setThemeId] = useState(()=>localStorage.getItem("bf_theme")||"light");
      const [big,setBig] = useState(()=>localStorage.getItem("bf_big")==="1");
      const C = THEMES[themeId]||THEMES.light;
      useEffect(()=>{localStorage.setItem("bf_theme",themeId);document.body.style.background=C.bg;document.body.style.color=C.text;},[themeId]);
      useEffect(()=>{localStorage.setItem("bf_big",big?"1":"0");},[big]);

      const [page,setPage] = useState("finder");     // finder | about | contact
      const [step,setStep] = useState(0);
      const [maxReached,setMaxReached] = useState(0);
      const [form,setForm] = useState({adults:"2",children:"0",childAges:"",region:"",budgetType:"kontant",budget:"",monthly:"",yearMin:"",kmMax:"",minHp:"",dailyKm:"",driveType:"",extras:"",character:"",variantWish:"",bodies:[],fuels:[],brands:[],excludeBrands:[],priorities:[],transmission:"",towbar:""});
      const [showResults,setShowResults] = useState(false);
      const [summary,setSummary] = useState("");
      const [cards,setCards] = useState([null,null]);
      const [loadingA,setLoadingA] = useState(false);
      const [loadingB,setLoadingB] = useState(false);
      const [error,setError] = useState("");
      const [excluded,setExcluded] = useState([[],[]]);
      const [lead,setLead] = useState(null);
      const set = k => v => setForm(f=>({...f,[k]:v}));

      const goStep = i => { setShowResults(false); setStep(i); setMaxReached(m=>Math.max(m,i)); window.scrollTo({top:0,behavior:"smooth"}); };
      const next = () => { const n=Math.min(step+1,4); setStep(n); setMaxReached(m=>Math.max(m,n)); window.scrollTo({top:0,behavior:"smooth"}); };
      const goHome = () => { setPage("finder"); setShowResults(false); setStep(0); window.scrollTo({top:0,behavior:"smooth"}); };

      const canNext = s => {
        if(s===0) return form.adults!=="" && form.children!=="";
        if(s===1) return !!(form.budget||form.monthly);
        if(s===2) return !!form.dailyKm;
        return true;
      };

      /* Sekventiel søgning, så alternativet kender forslag 1 og ikke gentager det */
      async function runSearch(excl) {
        setShowResults(true); setMaxReached(5);
        setCards([null,null]); setLoadingA(true); setLoadingB(true); setError("");
        window.scrollTo({top:0,behavior:"smooth"});
        let first = null;
        try {
          first = await fetchOneCar(buildProfile(form,1,excl[0]));
          setCards(c=>[first,c[1]]);
          setSummary(`Ud fra jeres svar er ${first.brand} ${first.model} det bedste match — herunder ser I også et bevidst anderledes alternativ.`);
        } catch(e) { setError("Kunne ikke hente anbefaling — prøv igen."); }
        setLoadingA(false);

        const firstName = first ? `${first.brand} ${first.model}` : "";
        try {
          const avoid = [...excl[1], ...excl[0], firstName].filter(Boolean);
          let second = await fetchOneCar(buildProfile(form,2,avoid,firstName));
          if (first && carKey(second)===carKey(first)) {          // samme bil — prøv én gang til
            second = await fetchOneCar(buildProfile(form,2,[...avoid,`${second.brand} ${second.model}`],firstName));
          }
          if (first && carKey(second)===carKey(first)) {
            setCards(c=>[c[0],null]);
            setError("Vi kunne ikke finde et reelt anderledes alternativ til din profil — prøv at udvide budget, mærker eller karosseri.");
          } else {
            setCards(c=>[c[0],second]);
          }
        } catch(e) { if(!error) setError("Kunne ikke hente det alternative forslag — prøv igen."); }
        setLoadingB(false);
      }

      async function handleReject(idx) {
        const rejected = cards[idx] ? `${cards[idx].brand} ${cards[idx].model}` : "";
        const other = cards[idx===0?1:0];
        const newExcl = excluded.map((e,i)=>i===idx?[...e,rejected]:e);
        setExcluded(newExcl); setError("");
        if(idx===0){setLoadingA(true);setCards(c=>[null,c[1]]);} else {setLoadingB(true);setCards(c=>[c[0],null]);}
        try {
          const avoid = [...newExcl[idx], other?`${other.brand} ${other.model}`:""].filter(Boolean);
          let car = await fetchOneCar(buildProfile(form, idx===0?1:2, avoid, other?`${other.brand} ${other.model}`:""));
          if (other && carKey(car)===carKey(other)) {
            car = await fetchOneCar(buildProfile(form, idx===0?1:2, [...avoid,`${car.brand} ${car.model}`], `${other.brand} ${other.model}`));
          }
          if(idx===0) setCards(c=>[car,c[1]]); else setCards(c=>[c[0],car]);
        } catch { setError("Kunne ikke hente nyt forslag."); }
        if(idx===0) setLoadingA(false); else setLoadingB(false);
      }

      const stepIdx = showResults ? 5 : step;
      const S = STEPS[stepIdx];

      return (
        <ThemeCtx.Provider value={C}>
        <div style={{minHeight:"100vh",background:C.bg,color:C.text,zoom:big?1.15:1}}>
          {/* HEADER — navnet fører altid til forsiden */}
          <header style={{borderBottom:`1px solid ${C.border}`,background:C.surface,position:"relative",zIndex:130}}>
            <div style={{maxWidth:820,margin:"0 auto",padding:"12px 16px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
              <button onClick={goHome} title="Gå til forsiden" aria-label={`${COMPANY_NAME} — gå til forsiden`}
                style={{display:"flex",alignItems:"center",gap:10,background:"transparent",border:"none",cursor:"pointer",padding:"6px 8px",minHeight:48,borderRadius:10}}>
                <span style={{fontSize:24}}>🚗</span>
                <span style={{fontFamily:"'Sora',sans-serif",fontSize:22,fontWeight:800,color:C.text}}>{COMPANY_NAME}</span>
              </button>
              <nav style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
                <button onClick={()=>{setPage("about");window.scrollTo({top:0});}} style={{background:"transparent",border:"none",color:page==="about"?C.accent:C.muted,fontSize:15,fontWeight:700,cursor:"pointer",padding:"10px 12px",minHeight:44}}>Om os</button>
                <button onClick={()=>{setPage("contact");window.scrollTo({top:0});}} style={{background:"transparent",border:"none",color:page==="contact"?C.accent:C.muted,fontSize:15,fontWeight:700,cursor:"pointer",padding:"10px 12px",minHeight:44}}>Kontakt</button>
                <button onClick={()=>setBig(b=>!b)} title="Større tekst" aria-pressed={big}
                  style={{background:big?C.accentSoft:"transparent",border:`1px solid ${big?C.accentBorder:C.border2}`,borderRadius:8,color:big?C.accent:C.muted,fontSize:14,fontWeight:800,cursor:"pointer",padding:"9px 12px",minHeight:44}}>A+</button>
                <button onClick={()=>setThemeId(t=>t==="light"?"dark":"light")} title={themeId==="light"?"Skift til mørkt design":"Skift til lyst design"}
                  style={{background:"transparent",border:`1px solid ${C.border2}`,borderRadius:8,color:C.muted,fontSize:15,cursor:"pointer",padding:"9px 12px",minHeight:44}}>{themeId==="light"?"🌙":"☀️"}</button>
              </nav>
            </div>
          </header>

          {page==="finder" && <Stepper step={stepIdx} maxReached={Math.max(maxReached, showResults?5:maxReached)} onGo={goStep}/>}

          <main style={{maxWidth:820,margin:"0 auto",padding:"26px 16px 80px"}}>
            {page==="about" && <AboutPage onBack={goHome} onContact={()=>{setPage("contact");window.scrollTo({top:0});}}/>}
            {page==="contact" && <ContactPage onBack={goHome}/>}

            {page==="finder" && !showResults && <>
              <div style={{marginBottom:24}}>
                <div style={{color:C.accent,fontSize:14,fontWeight:800,letterSpacing:.6,textTransform:"uppercase",marginBottom:6}}>Trin {step+1} af 5</div>
                <h1 style={{fontFamily:"'Sora',sans-serif",fontSize:28,fontWeight:800,color:C.text,marginBottom:6}}>{S.title}</h1>
                <p style={{color:C.muted,fontSize:17}}>{S.sub}</p>
              </div>

              <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:16,padding:"24px 20px 6px",boxShadow:C.shadow,animation:"fadeUp .3s ease"}}>
                {step===0 && <>
                  <Field label="Antal voksne"><SingleChips options={["1","2","3","4+"]} value={form.adults} onChange={set("adults")}/></Field>
                  <Field label="Antal børn"><SingleChips options={["0","1","2","3","4+"]} value={form.children} onChange={set("children")}/></Field>
                  {form.children!=="0"&&form.children!=="" && <Field label="Børnenes aldre" hint="valgfrit"><TxtInput value={form.childAges} onChange={set("childAges")} placeholder="F.eks. 3, 7, 12"/></Field>}
                  <Field label="Geografisk område"><SingleDropdown value={form.region} onChange={set("region")} options={REGIONS} placeholder="Vælg region"/></Field>
                </>}

                {step===1 && <>
                  <Field label="Betalingsform"><SingleChips options={["kontant","månedlig"]} value={form.budgetType} onChange={set("budgetType")}/></Field>
                  {form.budgetType==="månedlig"
                    ? <Field label="Månedlig ydelse"><NumInput value={form.monthly} onChange={set("monthly")} placeholder="F.eks. 4500" suffix="kr./md."/></Field>
                    : <Field label="Kontantbudget"><NumInput value={form.budget} onChange={set("budget")} placeholder="F.eks. 350000" suffix="kr."/></Field>}
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:16}}>
                    <Field label="Tidligste årsmodel" hint="valgfrit"><NumInput value={form.yearMin} onChange={set("yearMin")} placeholder="F.eks. 2018"/></Field>
                    <Field label="Maks km-stand" hint="valgfrit"><NumInput value={form.kmMax} onChange={set("kmMax")} placeholder="F.eks. 100000" suffix="km"/></Field>
                  </div>
                </>}

                {step===2 && <>
                  <Field label="Daglig km-forbrug"><NumInput value={form.dailyKm} onChange={set("dailyKm")} placeholder="F.eks. 40" suffix="km/dag"/></Field>
                  <Field label="Primær kørsel"><SingleChips options={["Primært by","Blandet","Primært motorvej"]} value={form.driveType} onChange={set("driveType")}/></Field>
                  <Field label="Særlige behov" hint="valgfrit"><TxtInput value={form.extras} onChange={set("extras")} placeholder="Anhænger, barnevogn, hunde…"/></Field>
                </>}

                {step===3 && <>
                  <Field label="Karosseri" hint="vælg gerne flere"><MultiChips options={BODY_TYPES} value={form.bodies} onChange={set("bodies")}/></Field>
                  <Field label="Drivmiddel" hint="vælg gerne flere"><MultiChips options={FUEL_TYPES} value={form.fuels} onChange={set("fuels")}/></Field>
                  <Field label="Foretrukne mærker" hint="skriv eller vælg" help="Skriv de første bogstaver, så finder vi mærket — alle mærker på det danske marked er med.">
                    <SearchableMultiSelect value={form.brands} onChange={set("brands")} options={BRANDS} placeholder="Skriv f.eks. “sko” for Skoda…"/>
                  </Field>
                  <Field label="Mærker du IKKE vil have" hint="valgfrit">
                    <SearchableMultiSelect value={form.excludeBrands} onChange={set("excludeBrands")} options={BRANDS} placeholder="Skriv et mærke du vil undgå…"/>
                  </Field>
                </>}

                {step===4 && <>
                  <Field label="Prioriteter" hint="vælg gerne flere"><MultiChips options={PRIORITIES} value={form.priorities} onChange={set("priorities")}/></Field>
                  <Field label="Bilens karakter" hint="valgfrit" help="Vælg “Sporty / performance”, hvis du leder efter sportsversioner som vRS, RS, GTI, ST, N eller AMG.">
                    <SingleChips options={CHARACTERS} value={form.character} onChange={set("character")}/>
                  </Field>
                  <Field label="Ønsket motor- eller udstyrsvariant" hint="valgfrit" help="Skriv den præcise betegnelse, hvis du kender den — f.eks. “vRS”, “R.S. Line”, “GTI”, “AMG Line”, “2.0 TDI 190”.">
                    <TxtInput value={form.variantWish} onChange={set("variantWish")} placeholder="F.eks. vRS, RS, GTI, AMG…"/>
                  </Field>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:16}}>
                    <Field label="Mindste motoreffekt" hint="valgfrit"><NumInput value={form.minHp} onChange={set("minHp")} placeholder="F.eks. 230" suffix="hk"/></Field>
                    <Field label="Gearkasse" hint="valgfrit"><SingleChips options={["Automatgear","Manuel","Ligemeget"]} value={form.transmission} onChange={set("transmission")}/></Field>
                  </div>
                  <Field label="Anhængertræk?" hint="valgfrit"><SingleChips options={["Ja, vigtigt","Rart at have","Nej tak"]} value={form.towbar} onChange={set("towbar")}/></Field>
                </>}
              </div>

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:26,gap:12,flexWrap:"wrap"}}>
                {step>0 ? <Btn kind="ghost" onClick={()=>goStep(step-1)}>← Tilbage</Btn> : <span/>}
                {step<4
                  ? <Btn onClick={next} disabled={!canNext(step)} size="lg">Næste →</Btn>
                  : <Btn onClick={()=>runSearch([[],[]])} size="lg">Find vores bil ✨</Btn>}
              </div>
              {!canNext(step) && <p style={{color:C.muted,fontSize:15,textAlign:"right",marginTop:10}}>Udfyld felterne ovenfor for at komme videre.</p>}
            </>}

            {page==="finder" && showResults && <Results
              cards={cards} loadingA={loadingA} loadingB={loadingB}
              form={form} summary={summary} onReject={handleReject}
              onPickService={s=>setLead(s)}
              onRefresh={()=>{setShowResults(false);setCards([null,null]);setSummary("");setExcluded([[],[]]);setStep(4);window.scrollTo({top:0,behavior:"smooth"});}}
            />}

            {error && <p role="alert" style={{color:C.bad,fontSize:16,textAlign:"center",marginTop:18,background:C.surface,border:`1px solid ${C.bad}44`,borderRadius:10,padding:"12px 16px"}}>{error}</p>}
          </main>

          <footer style={{borderTop:`1px solid ${C.border}`,background:C.surface,padding:"26px 16px 40px"}}>
            <div style={{maxWidth:820,margin:"0 auto",display:"flex",gap:16,flexWrap:"wrap",alignItems:"center"}}>
              <span style={{color:C.muted,fontSize:15}}>© {new Date().getFullYear()} {COMPANY_NAME} — uafhængig bilrådgivning · Kun Danmark</span>
              <span style={{marginLeft:"auto",display:"flex",gap:6,flexWrap:"wrap"}}>
                <button onClick={goHome} style={{background:"transparent",border:"none",color:C.accent,fontSize:15,fontWeight:700,cursor:"pointer",padding:"8px 10px",minHeight:44}}>Forside</button>
                <button onClick={()=>{setPage("about");window.scrollTo({top:0});}} style={{background:"transparent",border:"none",color:C.accent,fontSize:15,fontWeight:700,cursor:"pointer",padding:"8px 10px",minHeight:44}}>Om os</button>
                <button onClick={()=>{setPage("contact");window.scrollTo({top:0});}} style={{background:"transparent",border:"none",color:C.accent,fontSize:15,fontWeight:700,cursor:"pointer",padding:"8px 10px",minHeight:44}}>Kontakt</button>
              </span>
            </div>
          </footer>

          {lead && <LeadDialog service={lead} form={form} cards={cards} excluded={excluded} onClose={()=>setLead(null)}/>}
        </div>
        </ThemeCtx.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<React.StrictMode><App/></React.StrictMode>);
  </script>
</body>
</html>
